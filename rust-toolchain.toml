# The pinned Rust toolchain for v2 (ADR 0002 part 2; foundation step 2.2). CI installs it with `rustup toolchain install`
# before any cargo call. Each bump is its own change-set that reports the new warnings.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
