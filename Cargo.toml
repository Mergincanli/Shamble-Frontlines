# The v2 Rust workspace (ADR 0002 parts 2, 3, 4 and 7; foundation step 2.2). Every CI cargo command takes --locked.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

# Shared dependency versions, set once here; each enters with the first crate that needs it (ADR 0002 part 3).
[workspace.dependencies]
ts-rs = { version = "=12.0.1", default-features = false }
# The bindings the Worker loads (ADR 0002 parts 2 and 5): in sim-wasm, and in devtools for the test-only WebAssembly
# module, which links sim-wasm's panic hook (a later cargo-deny rule on wasm-bindgen must allow both). The
# command-line tool that writes the glue must be exactly this version (PM-0002-18); each bump is its own change-set.
wasm-bindgen = "=0.2.130"
# The collision library, the first outside crate inside the simulation (ADR 0004 part 10): exactly this version,
# with its own maps ordered and its vector maths scalar (`enhanced-determinism`), behind one module of `sim`
# (crates/sim/src/collision.rs). Each bump is its own change-set: the source audit behind the built-file check
# (packages/client/scripts/build-checks.mjs) is per version.
parry3d = { version = "=0.31.1", default-features = false, features = ["dim3", "f32", "alloc", "enhanced-determinism"] }
# The maths routines the simulation calls itself (ADR 0004 part 7: transcendental maths only through pinned libm):
# the exponential for the movement's easing shares and the sine and cosine (one routine, `sincos`) for the spawns'
# facings, each worked out once per match (change-set 4c). Already in the lockfile, at this version, through the
# collision library's vector maths; each routine it brings is on the built-file check's reviewed list with its
# vectors (packages/client/scripts/maths-allowed.mjs).
libm = "=0.2.16"

# Every crate opts in with `[lints] workspace = true` (ADR 0002 parts 4 and 7).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Overflow checks are on in all profiles for every workspace crate (ADR 0002 part 4, widened on foundation 2.2's review,
# RR-1: sim's inline, generic and small functions compile in their callers; register row OVERFLOW-ALL). "*" keeps every
# non-member at the release default setting, so release or an inheriting profile at opt-level 0, 1, "s" or "z" can
# make our sum() and product() run a dependency's unchecked copy: drop "*" or give that crate overflow-checks = true.
[profile.release]
overflow-checks = true

[profile.release.package."*"]
overflow-checks = false

# Third-party crates compiled into our libraries and tests check overflow too, each by name (register row
# OVERFLOW-ALL: "a named override for each such crate (it beats "*")"). Proc-macro crates and build scripts run on the
# build machine only and stay at "*". A new third-party crate joins this list in the change that adds it.
[profile.release.package.cfg-if]
overflow-checks = true

[profile.release.package.thiserror]
overflow-checks = true

[profile.release.package.ts-rs]
overflow-checks = true

[profile.release.package.unicode-ident]
overflow-checks = true

[profile.release.package.wasm-bindgen]
overflow-checks = true

[profile.release.package.wasm-bindgen-shared]
overflow-checks = true

# The collision library's tree (parry3d =0.31.1; change-set 4b): every crate `cargo tree -p sim-wasm` lists for
# wasm32, and `safe_arch`, which only an x86 build has (the native tests). The build's own check reads the wasm32
# list (packages/client/scripts/build-checks.mjs, missingOverflowOverrides).
[profile.release.package.approx]
overflow-checks = true

[profile.release.package.arrayvec]
overflow-checks = true

[profile.release.package.bitflags]
overflow-checks = true

[profile.release.package.bytemuck]
overflow-checks = true

[profile.release.package.byteorder]
overflow-checks = true

[profile.release.package.downcast-rs]
overflow-checks = true

[profile.release.package.either]
overflow-checks = true

[profile.release.package.equivalent]
overflow-checks = true

[profile.release.package.foldhash]
overflow-checks = true

[profile.release.package.glam]
overflow-checks = true

[profile.release.package.glamx]
overflow-checks = true

[profile.release.package.hash32]
overflow-checks = true

[profile.release.package.hashbrown]
overflow-checks = true

[profile.release.package.heapless]
overflow-checks = true

[profile.release.package.indexmap]
overflow-checks = true

[profile.release.package.libm]
overflow-checks = true

[profile.release.package.log]
overflow-checks = true

[profile.release.package.num-complex]
overflow-checks = true

[profile.release.package.num-traits]
overflow-checks = true

[profile.release.package.ordered-float]
overflow-checks = true

[profile.release.package.parry3d]
overflow-checks = true

[profile.release.package.rstar]
overflow-checks = true

[profile.release.package.safe_arch]
