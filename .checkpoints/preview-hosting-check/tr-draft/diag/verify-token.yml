# THROWAWAY: the preview hosting check for SHAMBLE FRONTLINES (ADR 0006, spike 1). Plan and results live in
# Mergincanli/Shamble-Frontlines. This file is deleted with this test repository.
# DRAFT, not placed, not reviewed: a by-hand check of the two values in `preview`. It asks Cloudflare's "Verify Token"
# method (GET /accounts/{account_id}/tokens/verify: "Test whether a token works.") whether the token works for the
# account, and prints only the answer's success flag, errors, status and dates, plus the two values' shapes (length,
# prefix, whitespace, 32 hex digits). It never prints either value.
name: verify-token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: preview
    steps:
      - name: The values' shapes, then Cloudflare's answer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          umask 077
          t="$CLOUDFLARE_API_TOKEN"; a="$CLOUDFLARE_ACCOUNT_ID"
          case "$t" in cfat_*) p=yes ;; *) p=no ;; esac
          if [[ $t =~ [[:space:]] ]]; then w=yes; else w=no; fi
          if [[ $a =~ ^[0-9a-f]{32}$ ]]; then h=yes; else h=no; fi
          echo "token: length ${#t}; starts with cfat_: $p; whitespace: $w"
          echo "account id: length ${#a}; 32 hex digits: $h"
          printf 'Authorization: Bearer %s\n' "$t" > "$RUNNER_TEMP/auth"
          code=$(curl -sS -o "$RUNNER_TEMP/verify.json" -w '%{http_code}' -H @"$RUNNER_TEMP/auth" \
            "https://api.cloudflare.com/client/v4/accounts/$a/tokens/verify")
          rm -f "$RUNNER_TEMP/auth"
          echo "HTTP $code"
          jq '{success, errors, result: ((.result // {}) | {status, expires_on, not_before})}' "$RUNNER_TEMP/verify.json"
          rm -f "$RUNNER_TEMP/verify.json"
          test "$code" = 200
