# THROWAWAY: the preview hosting check for SHAMBLE FRONTLINES (ADR 0006, spike 1). Plan and results live in
# Mergincanli/Shamble-Frontlines. This file is deleted with this test repository.
# Every pull request from a branch of this repository gets a preview:
#   build   builds the test site and reports its file sizes; holds no secret (the pull request's own code runs here)
#   deploy  uploads the built files to the test project; the Pages token reaches it only through the `preview`
#           environment, whose jobs wait for Mustafa's approval; it checks out and runs nothing from this repository
#   verify  reads the headers of every file on both links of the upload (PM-0006-2); holds no secret
name: deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  PROJECT: shamble-preview-check
  WRANGLER: wrangler@4.156.0

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the test site (mode preview) and report its file sizes (PM-0006-5)
        env:
          MARKER: ${{ github.sha }}
        run: |
          node --version
          node tools/build.mjs --mode preview --marker "$MARKER" --out dist
          node tools/check-sizes.mjs dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Refuse server code in the upload
        run: |
          if [ -e dist/_worker.js ] || [ -e dist/_routes.json ] || [ -e dist/functions ]; then
            echo "The build holds server code; nothing is deployed."; exit 1
          fi
      - id: upload
        name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MARKER: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          npx --yes "$WRANGLER" pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" \
            --commit-hash "$MARKER" --commit-message "preview-check run $RUN" --commit-dirty=true
          jq -c 'select(.type == "pages-deploy-detailed")' "$WRANGLER_OUTPUT_FILE_PATH" > detailed.ndjson
          test "$(wc -l < detailed.ndjson)" -eq 1
          mkdir -p records
          jq -c --arg branch "$BRANCH" --arg marker "$MARKER" --arg pr "$PR" --arg run "$RUN" \
            '{deployment_id, url, alias, environment, production_branch, branch: $branch, marker: $marker,
              pr: $pr, run: $run, mode: "preview", expect: "preview", made: .timestamp}' detailed.ndjson \
            > "records/$RUN-1.json"
          cat "records/$RUN-1.json"
          echo "url=$(jq -r '.alias // .url' "records/$RUN-1.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-record
          path: records/
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-record
          path: records
      - name: Every file's headers on both links (PM-0006-2)
        run: node tools/check-headers.mjs --records records --out headers.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: headers
          path: headers.json
          retention-days: 30
