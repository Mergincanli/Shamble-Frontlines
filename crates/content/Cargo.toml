[package]
name = "content"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No dependency at all: the reader of the game's content files is all our own code (Mustafa's CONTENT-SOURCE (c),
# 2026-11-26), and the simulation will depend on this crate (ADR 0002 part 3; ADR 0005's foundation line, which
# crates/devtools/tests/dependency_rules.rs holds).

# Test builds only: the TypeScript types of the content kinds are written by a test (ADR 0002 part 5), as the
# protocol crate's are. The type writer's derive must stand beside the types it reads, so it is this crate's one
# dependency of any kind, and no build that players get holds it (crates/devtools/tests/dependency_rules.rs).
[dev-dependencies]
ts-rs = { workspace = true }

[lints]
workspace = true
