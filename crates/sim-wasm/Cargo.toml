[package]
name = "sim-wasm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A cdylib for the .wasm file the Worker loads, an rlib for the native tests (the follow-up WASM-ARTIFACT).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
client-endpoint = { path = "../client-endpoint" }
# The constructor reads the match's content bundle (one content set per match: ADR 0005 CD-7).
content = { path = "../content" }
protocol = { path = "../protocol" }
room = { path = "../room" }
sim = { path = "../sim" }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
