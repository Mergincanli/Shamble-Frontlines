[package]
name = "room"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The simulation it runs and the messages it reads and writes (ADR 0002 part 3): our own crates, by path.
[dependencies]
protocol = { path = "../protocol" }
sim = { path = "../sim" }

# The room's own tests build a collision world from a map document (a content type); the room's code takes the world
# from the constructor that loads the content, and never names `content` (devtools' tests/layering.rs holds that).
[dev-dependencies]
content = { path = "../content" }

[lints]
workspace = true
