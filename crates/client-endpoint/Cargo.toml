[package]
name = "client-endpoint"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The simulation's constants and the messages it reads and writes (ADR 0002 part 3): our own crates, by path.
[dependencies]
protocol = { path = "../protocol" }
sim = { path = "../sim" }

# The endpoint's own tests build its copy of the collision world (the aim's cast) from a map document (a content
# type); the endpoint's code takes the world from the constructor, and never names `content` (devtools'
# tests/layering.rs holds that).
[dev-dependencies]
content = { path = "../content" }

[lints]
workspace = true
