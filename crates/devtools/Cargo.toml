[package]
name = "devtools"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# An rlib for the native tests and tools, and a cdylib for the test-only WebAssembly module: the development build
# makes it so that the rule tests also run in WebAssembly (ADR 0002 part 8). It is never part of what players get.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The content proofs the test module runs in WebAssembly, the bounded fuzz run and the time report.
content = { path = "../content" }
sim = { path = "../sim" }
# For the panic hook as players get it, linked into the test module, and for the local match's own step, which the
# replay runner and the link simulator's tests run unchanged.
sim-wasm = { path = "../sim-wasm" }
wasm-bindgen = { workspace = true }

# Test-only: the test that ties the content crate's aim reach to the aim point's own number types
# (tests/aim_reach.rs). Nothing under src/ names the protocol crate (security-auditor's note on 4b-1's batch).
[dev-dependencies]
protocol = { path = "../protocol" }

[lints]
workspace = true
