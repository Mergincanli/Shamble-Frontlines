[package]
name = "npt-tcpinfo"
description = "Two readings of a Linux TCP socket for the plain WebSocket path: tcpi_rtt (TCP_INFO) and SIOCOUTQ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The workspace lints, unsafe_code = "deny" included: srtt_us and unacked_and_unsent in src/linux.rs each carry one
# #[allow(unsafe_code, reason = "...")] (ADR 0002:264-265; u3c-plan.md 1.8 (a)), and nothing else in the crate relaxes
# it. check.mjs's deps step checks both, and that this manifest keeps `workspace = true` and never sets unsafe_code.
[lints]
workspace = true

# libc is the only normal dependency, and only on Linux; the other targets build the stub. check.mjs's deps step
# checks that libc is all the crate ships with (socket2 below is a dev dependency: tests and the probe only).
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
# Tests and the root-run probe only; already in Cargo.lock (tokio's). "all" opens TCP_QUICKACK, TCP_CONGESTION and
# raw sockets (the probe's sock_diag query); a feature is not recorded in Cargo.lock.
socket2 = { version = "=0.6.5", features = ["all"] }
