[package]
name = "npt-net"
description = "Native transport adapters (both WebTransport crates, WebSocket) and L2 under the real socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# One WebTransport crate per feature, swappable behind npt-link (PM-0001-35), pinned in the workspace.
wt-wtransport = ["dep:wtransport"]
wt-wtq = ["dep:web-transport-quinn"]

[dependencies]
npt-link.workspace = true
# npt-l1's Profile and ReorderStep, so both layers read one definition (Mustafa's U3-Q7, 2026-11-06).
npt-l1.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
# L2's ImpairSocket implements quinn's socket trait under either crate's endpoint (U3, R5-TEST-OQ2).
quinn.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# wtransport's `quinn` feature (no new dependency, so Cargo.lock is unchanged) opens
# IncomingSessionFuture::with_quic_incoming: the session accepted from our own quinn endpoint over ImpairSocket (M8).
wtransport = { workspace = true, optional = true, features = ["quinn"] }
web-transport-quinn = { workspace = true, optional = true }
