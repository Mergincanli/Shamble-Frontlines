# npt-proto shares npt-sim's bans (plan §4.5): its quantisation and decoding must give the same bits on native and Wasm.
# Keep this file identical to crates/sim/clippy.toml below this header; check.mjs's deps step compares them line for
# line (clippyTwinProblems, U4a).

disallowed-types = [
    { path = "std::collections::HashMap", reason = "hash-map ban (GLOSSARY §7): iteration order is not deterministic" },
    { path = "std::collections::HashSet", reason = "hash-map ban (GLOSSARY §7): iteration order is not deterministic" },
    { path = "std::time::Instant", reason = "the clock ban: time is the tick counter, passed in" },
    { path = "std::time::SystemTime", reason = "the clock ban: time is the tick counter, passed in" },
]

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "the clock ban" },
    { path = "std::time::SystemTime::now", reason = "the clock ban" },
    "f32::round_ties_even", "f64::round_ties_even",
    "f32::signum", "f64::signum",
    "f32::div_euclid", "f64::div_euclid",
    "f32::rem_euclid", "f64::rem_euclid",
    "f32::powi", "f64::powi",
    "f32::powf", "f64::powf",
    "f32::exp", "f64::exp",
    "f32::exp2", "f64::exp2",
    "f32::exp_m1", "f64::exp_m1",
    "f32::ln", "f64::ln",
    "f32::log", "f64::log",
    "f32::log2", "f64::log2",
    "f32::log10", "f64::log10",
    "f32::ln_1p", "f64::ln_1p",
    "f32::cbrt", "f64::cbrt",
    "f32::hypot", "f64::hypot",
    "f32::sin", "f64::sin",
    "f32::cos", "f64::cos",
    "f32::tan", "f64::tan",
    "f32::asin", "f64::asin",
    "f32::acos", "f64::acos",
    "f32::atan", "f64::atan",
    "f32::atan2", "f64::atan2",
    "f32::sin_cos", "f64::sin_cos",
    "f32::sinh", "f64::sinh",
    "f32::cosh", "f64::cosh",
    "f32::tanh", "f64::tanh",
    "f32::asinh", "f64::asinh",
    "f32::acosh", "f64::acosh",
    "f32::atanh", "f64::atanh",
    "f32::recip", "f64::recip",
    "f32::to_degrees", "f64::to_degrees",
    "f32::to_radians", "f64::to_radians",
    "f32::max", "f64::max",
    "f32::min", "f64::min",
    "f32::clamp", "f64::clamp",
    "f32::midpoint", "f64::midpoint",
    "f32::next_up", "f64::next_up",
    "f32::next_down", "f64::next_down",
]
