[package]
name = "npt-proto"
description = "The wire format: messages, session controls, E3 quantisation, the delta codec, size limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The planted defects (plan §4.7, E19), bites builds only; npt-sim's too, so a bites build of npt-proto compiles its
# dependency's own bites in (after carry 2, npt-proto's bites are its own: u4-build-plan.md §4.4, §4.11).
bites = ["npt-sim/bites"]

[dependencies]
# No transport crate and no clock (plan §4.2); builds for wasm32. npt-sim for the wire grid and the seam's plain-data
# types (plan §4.2: ADR 0002:188, the advisor's Q23 ruling); npt-link for `Channel` (catalogue item 2). Leaf to leaf.
npt-sim.workspace = true
npt-link.workspace = true

[dev-dependencies]
# U4a's fixed-seed cases (u4-build-plan.md §5 U4a: a1's 10,000 round trips per type, a2's 100,000 random buffers per
# type) draw from ChaCha8Rng, the workspace's pinned generator; U4s adds them so no wave-1 lane edits a manifest or
# Cargo.lock (the arch review's F7). Dev dependencies: they never ship (plan §4.2, C10).
rand_chacha.workspace = true
rand_core.workspace = true
