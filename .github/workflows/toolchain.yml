# Foundation step 2.2 (ADR 0002 part 2, migration plan 2.2): the pinned Rust toolchain from rust-toolchain.toml, then
# the Rust and npm workspaces' builds and tests with the network cut off. One job, `toolchain`; the gate and smoke jobs
# stay in gate.yml. Step 2.3 replaces this file with the gate v2's workflow.
# The cut: the last step runs in its own network namespace (sudo unshare --net), with loopback up, back as the runner's
# user with no docker group and no_new_privs; a TCP probe to an address resolved before the cut must connect outside
# and fail inside (only curl exit 7 or 28 counts as cut).
# CI-WASM: before the cut, the wasm-bindgen tool's archive is fetched and checked against Mustafa's values and by
# GitHub's own check of the release; its one program is installed root-owned. Inside the cut the page is built with
# it; then the boundary tests, the type checks of the Worker, the page and the browser specs, and the browser tests
# run in the runner image's Google Chrome, then the tests the firefox project of playwright.config.ts names run in its
# Mozilla Firefox (Mustafa's FIREFOX-SOURCE (c); Playwright drives that Firefox over WebDriver BiDi): nothing is
# downloaded for them. Inside the cut the job also runs every crate's release tests, the two vector generators' checks
# and a wasm32 build of the test-only crate (devtools) on its own line.
name: toolchain

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only the explicit install below brings a toolchain: rustup turned automatic install back on by default in 1.28.1.
  RUSTUP_AUTO_INSTALL: "0"

defaults:
  run:
    shell: bash

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No cache in this job, restored or saved: code planted for a later step cannot reach another run through it.
    cache-mode: none
    env:
      # The one wasm-bindgen tool the build may run: Mustafa's values of 2026-11-18 (TOOL-SOURCE (a)); any other file,
      # version or checksum comes back to him. The first tool step compares them line for line with
      # packages/client/scripts/wasm-bindgen-tool.mjs, the copy build.mjs checks the program against before each run.
      # WB_TOOL and each folder above it are root-owned and closed to others, so no process inside the cut can swap it.
      WB_VERSION: "0.2.130"
      WB_NAME: wasm-bindgen-0.2.130-x86_64-unknown-linux-musl
      WB_ARCHIVE_BYTES: "11860397"
      WB_ARCHIVE_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
      WB_PROGRAM_BYTES: "8170784"
      WB_PROGRAM_SHA256: ca4df773020dae87d92b9eadb2b85412bea7a9cf6318ab9999dd119fd9f46931
      WB_TOOL: /wasm-bindgen-0.2.130/wasm-bindgen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the pinned Rust toolchain from rust-toolchain.toml (before any cargo call)
        run: rustup toolchain install

      - name: Check rustc against the pin
        run: |
          pin=$(sed -n 's/^channel = "\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)"$/\1/p' rust-toolchain.toml)
          [ -n "$pin" ] && [ "$(printf '%s\n' "$pin" | wc -l)" -eq 1 ] || { echo "rust-toolchain.toml: no single exact x.y.z channel"; exit 1; }
          [ -z "${RUSTUP_TOOLCHAIN-}" ] || { echo "RUSTUP_TOOLCHAIN is set: it would beat rust-toolchain.toml"; exit 1; }
          active=$(rustup show active-toolchain); echo "$active"
          case "$active" in *rust-toolchain.toml*) ;; *) echo "the active toolchain does not come from rust-toolchain.toml"; exit 1 ;; esac
          v=$(rustc --version); echo "$v"
          case "$v" in "rustc $pin "*) echo "rustc equals the pin $pin" ;; *) echo "rustc is not the pin $pin"; exit 1 ;; esac
          cargo --version; node --version; npm --version

      # wasm-bindgen-tool.mjs is read as text, never imported: no code of the repository runs with the network.
      - name: The wasm-bindgen tool's archive (https only, then its size and sha256, before any tar call)
        run: |
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WB_VERSION/$WB_NAME.tar.gz"
          for line in "  version: \"$WB_VERSION\"," "    url: \"$url\"," "    bytes: $WB_ARCHIVE_BYTES," \
              "    sha256: \"$WB_ARCHIVE_SHA256\"," "    member: \"$WB_NAME/wasm-bindgen\"," \
              "    bytes: $WB_PROGRAM_BYTES," "    sha256: \"$WB_PROGRAM_SHA256\","; do
            grep -qxF -- "$line" packages/client/scripts/wasm-bindgen-tool.mjs \
              || { echo "packages/client/scripts/wasm-bindgen-tool.mjs lacks this line of the workflow: $line"; exit 1; }
          done
          mkdir "$RUNNER_TEMP/wasm-bindgen"
          curl --fail -L --max-redirs 2 --proto '=https' --proto-redir '=https' --max-filesize 12000000 -sS \
            -o "$RUNNER_TEMP/wasm-bindgen/$WB_NAME.tar.gz" -w 'final address: %{url_effective}\n' "$url" \
            | sed 's/?.*$/?(query left out)/'
          bytes=$(stat -c %s "$RUNNER_TEMP/wasm-bindgen/$WB_NAME.tar.gz"); echo "size: $bytes"
          [ "$bytes" = "$WB_ARCHIVE_BYTES" ] || { echo "the archive is $bytes bytes, not $WB_ARCHIVE_BYTES"; exit 1; }
          printf '%s  %s\n' "$WB_ARCHIVE_SHA256" "$RUNNER_TEMP/wasm-bindgen/$WB_NAME.tar.gz" | sha256sum -c -

      # Before the tool's first run (Mustafa's CI-WASM (a)). The only step with the token; gh 2.93.0 keeps it off the
      # TUF mirrors (CVE-2026-48501).
      - name: GitHub's own check of the archive (gh release verify-asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh_version=$(gh --version | awk 'NR == 1 { print $3 }')
          case "$gh_version" in "" | *[!0-9.]*) echo "gh printed no version of the form x.y.z: $gh_version"; exit 1 ;; esac
          printf '%s\n' 2.93.0 "$gh_version" | sort -V -C || { echo "gh is older than 2.93.0"; exit 1; }
          gh release verify-asset "$WB_VERSION" "$RUNNER_TEMP/wasm-bindgen/$WB_NAME.tar.gz" --repo wasm-bindgen/wasm-bindgen

      - name: The tool's one program (the member list, then only wasm-bindgen taken out, installed root-owned, checked)
        run: |
          dl="$RUNNER_TEMP/wasm-bindgen"; archive="$dl/$WB_NAME.tar.gz"
          tar -tzf "$archive" | LC_ALL=C sort > "$dl/members.txt"
          printf '%s\n' "" LICENSE-APACHE LICENSE-MIT README.md wasm-bindgen wasm-bindgen-test-runner wasm2es6js \
            | sed "s|^|$WB_NAME/|" | LC_ALL=C sort > "$dl/expected.txt"
          diff "$dl/expected.txt" "$dl/members.txt" || { echo "the archive's member list is not the expected one"; exit 1; }
          tar -tvzf "$archive" | awk '{ print } substr($1, 1, 1) !~ /^[-d]$/ || NF != 6 || $3 > 67108864 { bad = 1 } END { exit bad }' \
            || { echo "a member is not a plain file or folder, has a name with a space, or is above 64 MiB"; exit 1; }
          mkdir "$dl/x"
          tar -xzf "$archive" -C "$dl/x" --no-same-owner --no-same-permissions --strip-components=1 "$WB_NAME/wasm-bindgen"
          [ "$(ls -A "$dl/x")" = wasm-bindgen ] || { echo "more than the one program came out"; exit 1; }
          case "$WB_TOOL" in /*) ;; *) echo "WB_TOOL is not an absolute path: $WB_TOOL"; exit 1 ;; esac
          sudo -n mkdir -m 0755 "${WB_TOOL%/*}" && sudo -n chown root:root "${WB_TOOL%/*}" \
            || { echo "${WB_TOOL%/*} exists already or could not be made: the tool needs a fresh folder made here as root"; exit 1; }
          sudo -n install -o root -g root -m 0555 "$dl/x/wasm-bindgen" "$WB_TOOL"
          [ -f "$WB_TOOL" ] && [ ! -L "$WB_TOOL" ] || { echo "$WB_TOOL is not a plain file"; exit 1; }
          set -- "$WB_TOOL"; p="$WB_TOOL"; until [ -z "$p" ]; do p="${p%/*}"; set -- "$@" "${p:-/}"; done
          stat -c 'mode %a, owner %U:%G, %s bytes, %n' "$@"
          [ "$(find "$@" -maxdepth 0 \( -type f -o -type d \) -user root ! -perm /022 -printf '.\n' | wc -l)" -eq "$#" ] \
            || { echo "$WB_TOOL or a folder above it is missing or a link, is not owned by root, or others than root may write in it"; exit 1; }
          [ "$(stat -c %s "$WB_TOOL")" = "$WB_PROGRAM_BYTES" ] || { echo "the program is not $WB_PROGRAM_BYTES bytes"; exit 1; }
          printf '%s  %s\n' "$WB_PROGRAM_SHA256" "$WB_TOOL" | sha256sum -c -

      - name: Fetch every dependency (the last step with the network)
        run: |
          cargo fetch --locked
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test with the network cut off
        run: |
          command -v unshare setpriv ip curl getent
          probe_ip=$(getent ahostsv4 github.com | awk 'NR == 1 { print $1 }' || true)
          [ -n "$probe_ip" ] || { echo "control failed: github.com has no IPv4 address before the cut"; exit 1; }
          curl -sS --max-time 20 -o /dev/null --resolve "github.com:443:$probe_ip" https://github.com/ \
            || { echo "control failed: no connection before the cut, so the probe below would prove nothing"; exit 1; }
          echo "control: connected to $probe_ip:443 before the cut"
          sudo -n unshare --net -- bash -ec 'ip link set lo up; exec "$@"' lo-up \
            setpriv --reuid="$(id -u)" --regid=nogroup --clear-groups --no-new-privs -- \
            env -i HOME="$HOME" PATH="$PATH" USER="$USER" CI=true LANG=C.UTF-8 PROBE_IP="$probe_ip" \
              CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
              RUSTUP_AUTO_INSTALL=0 npm_config_update_notifier=false \
              SHAMBLE_WASM_BINDGEN="$WB_TOOL" \
            bash --norc --noprofile -euo pipefail -c '
              id; ip -o link; rustc --version
              getent hosts github.com || echo "getent: no answer (printed, not judged)"
              rc=0; curl -sS --max-time 10 -o /dev/null --resolve "github.com:443:$PROBE_IP" https://github.com/ || rc=$?
              case "$rc" in
                0) echo "the network is still reachable inside the cut"; exit 1 ;;
                7|28) echo "the network is cut: no TCP connection to $PROBE_IP:443 (curl exit $rc)" ;;
                *) echo "probe inconclusive: curl exit $rc"; exit 1 ;;
              esac
              cargo test --workspace --locked
              SHAMBLE_WRITE_TYPES=1 cargo test --workspace --locked
              changed=$(git status --porcelain --untracked-files=all -- packages/types/src/generated)
              [ -z "$changed" ] || { echo "writing the generated types again changed:"; echo "$changed"; exit 1; }
              cargo test --release -p sim -p protocol -p room -p client-endpoint -p sim-wasm -p devtools --locked
              echo "== the two vector generators checks: the committed files equal what each generator makes (nothing written)"
              python3 --version
              python3 -I -B crates/devtools/vectors/make_chacha8_vectors.py --check
              python3 -I -B crates/devtools/vectors/make_f32_vectors.py --check
              cargo build --locked --target wasm32-unknown-unknown -p sim -p protocol -p room -p client-endpoint -p sim-wasm
              echo "== the test-only module (devtools) built for wasm32 on its own line, so a native-only dependency fails here by name"
              cargo build --locked --target wasm32-unknown-unknown -p devtools --lib
              npm ci --offline --ignore-scripts --no-audit --no-fund
              npm test --workspaces
              npx --no -- tsc --version
              strict="--noEmit --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --noImplicitOverride --noFallthroughCasesInSwitch --noImplicitReturns --isolatedModules --verbatimModuleSyntax --erasableSyntaxOnly --allowImportingTsExtensions --module preserve --target es2023 --lib es2023"
              shipped=$(find packages/types/src -name "*.ts" ! -name "*.test.ts" | LC_ALL=C sort)
              tests=$(find packages/types/src -name "*.test.ts" | LC_ALL=C sort)
              [ -n "$shipped" ]
              [ -n "$tests" ]
              npx --no -- tsc --ignoreConfig $strict $shipped
              npx --no -- tsc --ignoreConfig $strict --skipLibCheck $shipped $tests
              echo "== the page as players get it, then the development page the browser tests need"
              node packages/client/scripts/build.mjs --production --out-dir "$PWD/.gate/dist-production"
              node packages/client/scripts/build.mjs --out-dir "$PWD/.gate/dist-development"
              echo "== the Wasm built here, and the builder paths it carries (RR-F5: printed, not judged)"
              sha256sum packages/sim-worker/pkg/sim_wasm_bg.wasm
              grep -ao "/[A-Za-z0-9._/+-]*/\.cargo/registry/src/[A-Za-z0-9._/+-]*\.rs" packages/sim-worker/pkg/sim_wasm_bg.wasm || echo "no registry path in the Wasm"
              echo "== the boundary tests, on the built Wasm"
              npx --no -- vitest run --root packages/sim-worker --dir packages/sim-worker/boundary
              echo "== the type checks: the shipped files of the Worker and the page with the lib check, then with their tests; then the browser specs"
              common="${strict% --lib es2023}"
              worker=$(find packages/sim-worker/src -name "*.ts" ! -name "*.test.ts" | LC_ALL=C sort)
              worker_tests=$(find packages/sim-worker/src -name "*.test.ts" | LC_ALL=C sort)
              page=$(find packages/client/src -name "*.ts" ! -name "*.test.ts" | LC_ALL=C sort)
              page_tests=$(find packages/client/src -name "*.test.ts" | LC_ALL=C sort)
              specs=$(find packages/e2e/tests -name "*.ts" | LC_ALL=C sort)
              for list in "$worker" "$worker_tests" "$page" "$page_tests" "$specs"; do [ -n "$list" ] || { echo "a file list is empty"; exit 1; }; done
              npx --no -- tsc --ignoreConfig $common --lib es2023,webworker,esnext.disposable $worker packages/sim-worker/pkg/sim_wasm.d.ts
              npx --no -- tsc --ignoreConfig $common --lib es2023,webworker,esnext.disposable --skipLibCheck $worker $worker_tests packages/sim-worker/pkg/sim_wasm.d.ts
              npx --no -- tsc --ignoreConfig $common --lib es2023,dom,dom.iterable,esnext.disposable --types vite/client $page
              npx --no -- tsc --ignoreConfig $common --lib es2023,dom,dom.iterable,esnext.disposable --types vite/client --skipLibCheck $page $page_tests
              npx --no -- tsc --ignoreConfig $common --lib es2023,dom,dom.iterable --skipLibCheck packages/e2e/node-names.d.ts packages/e2e/playwright.config.ts $specs
              echo "== the browser tests, one at a time, never retried, stopped by Playwright after 5 minutes (so before the job)"
              /opt/google/chrome/chrome --version
              SHAMBLE_DIST="$PWD/.gate/dist-development" SHAMBLE_CHROMIUM=/opt/google/chrome/chrome \
                npx --no -- playwright test -c packages/e2e/playwright.config.ts --project=chromium --workers=1 --retries=0 \
                  --reporter=list --global-timeout=300000
              echo "== the tests the firefox project names, in the runner image Mozilla Firefox, the same limits (never the allocation spec)"
              if ! cache=$(/usr/sbin/ldconfig -p); then echo "libEGL.so.1: not checked, ldconfig -p failed (printed, not judged)"; elif printf "%s\n" "$cache" | grep -F "libEGL.so.1 "; then :; else echo "libEGL.so.1: not in the loader cache of this runner (printed, not judged)"; fi
              [ -f /usr/lib/firefox/firefox ] && [ ! -L /usr/lib/firefox/firefox ] || { echo "/usr/lib/firefox/firefox is not a plain file"; exit 1; }
              /usr/lib/firefox/firefox --version
              SHAMBLE_DIST="$PWD/.gate/dist-development" SHAMBLE_FIREFOX=/usr/lib/firefox/firefox \
                npx --no -- playwright test -c packages/e2e/playwright.config.ts --project=firefox --workers=1 --retries=0 \
                  --reporter=list --global-timeout=300000
            '
